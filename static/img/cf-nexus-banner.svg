<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <!-- Background -->
  <rect width="900" height="220" fill="#0a0a0f"/>
  
  <!-- Subtle edge lines -->
  <line x1="0" y1="1" x2="900" y2="1" stroke="#1a1a2e" stroke-width="0.5"/>
  <line x1="0" y1="219" x2="900" y2="219" stroke="#1a1a2e" stroke-width="0.5"/>
  
  <!-- Top separator -->
  <line x1="100" y1="35" x2="800" y2="35" stroke="#6b21a8" stroke-width="0.5" opacity="0.6"/>
  
  <!-- CF-NEXUS label -->
  <text x="450" y="28" text-anchor="middle" fill="#8b8ba0" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="6">CF-NEXUS</text>
  
  <!-- Subtitle -->
  <text x="450" y="58" text-anchor="middle" fill="#8b8ba0" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="8">SECURITY DIVISION</text>
  
  <!-- Main separator -->
  <line x1="100" y1="72" x2="800" y2="72" stroke="#6b21a8" stroke-width="0.5" opacity="0.6"/>
  
  <!-- CHAOS FOUNDRY title -->
  <text x="450" y="125" text-anchor="middle" fill="#a855f7" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" letter-spacing="12">CHAOS FOUNDRY</text>
  
  <!-- Bottom separator -->
  <line x1="100" y1="142" x2="800" y2="142" stroke="#6b21a8" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Arch & Yuki -->
  <text x="450" y="168" text-anchor="middle" fill="#7c3aed" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="4">ARCH &amp; YUKI</text>
  
  <!-- Tagline -->
  <text x="450" y="192" text-anchor="middle" fill="#6b7280" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="3">RED TEAM  ·  STREAMING  ·  CHAOS</text>
  
  <!-- PUBLIC NODE -->
  <text x="790" y="16" text-anchor="end" fill="#4b5563" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="3">PUBLIC NODE</text>
  
  <!-- Corner marks -->
  <polyline points="30,15 30,5 40,5" fill="none" stroke="#6b21a8" stroke-width="0.75" opacity="0.4"/>
  <polyline points="870,15 870,5 860,5" fill="none" stroke="#6b21a8" stroke-width="0.75" opacity="0.4"/>
  <polyline points="30,205 30,215 40,215" fill="none" stroke="#6b21a8" stroke-width="0.75" opacity="0.4"/>
  <polyline points="870,205 870,215 860,215" fill="none" stroke="#6b21a8" stroke-width="0.75" opacity="0.4"/>
</svg>